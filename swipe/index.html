<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>يوستينا تختار · Youstina Picks</title>
<meta property="og:title" content="يوستينا تختار — اختاري تصميم الدعوة">
<meta property="og:description" content="اسحبي يمين لو عجبك · شمال لو مش عاجبك 🤍">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#5C4A6E; --ink:#3E3348; --mauve:#A493B4; --lilac:#C9B8DC; --peri:#AEB4E8;
    --mist:#F7F3FB; --pale:#EFE9F6; --gold:#A98545; --gold-b:#C9A96A; --ivory:#FBF9F4;
    --like:#5aa66c; --nope:#c25a5a; --love:#b8860b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{font-family:'Cairo',sans-serif;background:linear-gradient(170deg,var(--mist),#FDFCFE 45%,var(--pale));color:var(--ink);display:flex;flex-direction:column;user-select:none}
  .en{font-family:'Cormorant Garamond',serif}

  header{text-align:center;padding:14px 16px 4px;flex:0 0 auto}
  header h1{font-family:'Amiri',serif;font-size:22px;color:var(--plum)}
  header .sub{font-size:12px;color:#8a7f96}
  .round-pill{display:inline-block;margin-top:4px;font-size:11.5px;background:#EDE5F7;color:var(--plum);border-radius:100px;padding:3px 14px;font-weight:600}
  .prog{height:5px;background:#E9E1F4;border-radius:99px;margin:8px auto 0;max-width:340px;overflow:hidden}
  .prog i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-b));border-radius:99px;transition:width .3s}
  .lang-pill{position:fixed;top:10px;left:10px;z-index:60;font-size:12px;border:1px solid #E9E1F4;background:#fff;border-radius:100px;padding:5px 14px;cursor:pointer;color:var(--plum);font-weight:600}

  /* ── deck ── */
  #stage{flex:1;position:relative;max-width:440px;width:100%;margin:8px auto 0;padding:0 14px}
  .card{
    position:absolute;inset:6px 14px;border-radius:22px;overflow:hidden;background:#fff;
    box-shadow:0 18px 50px rgba(62,51,72,.22);touch-action:none;cursor:grab;
    display:flex;flex-direction:column;will-change:transform;
  }
  .card img{flex:1;width:100%;object-fit:cover;pointer-events:none;background:var(--pale)}
  .card .strip{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:linear-gradient(180deg,rgba(255,255,255,.94),#fff)}
  .card .t-ar{font-family:'Amiri',serif;font-size:18px;color:var(--plum)}
  .card .t-en{font-size:12.5px;color:#8a7f96;letter-spacing:.08em;text-transform:uppercase}
  .card .peek{flex:0 0 auto;font-size:11.5px;color:var(--gold);border:1px solid rgba(169,133,69,.4);border-radius:100px;padding:4px 12px;cursor:pointer;white-space:nowrap}
  .stamp{
    position:absolute;top:26px;font-family:'Cairo';font-weight:700;font-size:30px;letter-spacing:.06em;
    padding:6px 18px;border:4px solid;border-radius:12px;opacity:0;transform:rotate(-14deg);pointer-events:none;background:rgba(255,255,255,.82)
  }
  .stamp.yes{right:18px;color:var(--like);border-color:var(--like)}
  .stamp.no{left:18px;color:var(--nope);border-color:var(--nope);transform:rotate(14deg)}

  /* ── controls ── */
  #controls{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:16px;padding:14px 0 max(16px, env(safe-area-inset-bottom))}
  #controls button{
    width:58px;height:58px;border-radius:50%;border:1.5px solid #E9E1F4;background:#fff;font-size:24px;cursor:pointer;
    box-shadow:0 6px 20px rgba(62,51,72,.12);transition:transform .15s;display:flex;align-items:center;justify-content:center;
  }
  #controls button:active{transform:scale(.9)}
  #btnNope{color:var(--nope)} #btnLike{color:var(--like)} #btnLove{color:var(--love);width:46px;height:46px;font-size:19px}
  #btnUndo,#btnComment{width:46px;height:46px;font-size:18px;color:#8a7f96}
  .hint{text-align:center;font-size:11.5px;color:#a094ae;padding-bottom:6px}

  /* ── overlays ── */
  .ov{position:fixed;inset:0;z-index:70;background:rgba(62,51,72,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px}
  .ov[hidden]{display:none}
  .sheet{background:#fff;border-radius:20px;max-width:430px;width:100%;max-height:88vh;overflow:auto;padding:20px}
  .sheet h3{font-family:'Amiri',serif;color:var(--plum);font-size:20px;margin-bottom:4px}
  .sheet .sh-en{font-size:12px;color:#8a7f96;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
  .sheet textarea{width:100%;min-height:90px;border:1.5px solid #E9E1F4;border-radius:12px;padding:12px;font-family:'Cairo';font-size:14px;resize:vertical}
  .sheet .row{display:flex;gap:10px;margin-top:12px}
  .sheet .row button{flex:1;border:0;border-radius:100px;padding:12px;font-family:'Cairo';font-weight:700;font-size:14px;cursor:pointer}
  .b-gold{background:linear-gradient(120deg,var(--gold),var(--gold-b));color:#fff}
  .b-ghost{background:var(--pale);color:var(--plum)}
  .suite-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .suite-grid figure{border-radius:12px;overflow:hidden;border:1px solid #F1EBF8}
  .suite-grid img{width:100%;display:block;background:var(--pale)}
  .suite-grid figcaption{font-size:10.5px;text-align:center;color:#8a7f96;padding:4px}
  .suite-grid .wide{grid-column:span 2}

  /* ── done / podium ── */
  #done{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
  #done h2{font-family:'Amiri',serif;font-size:26px;color:var(--plum)}
  #done .podium{display:flex;flex-direction:column;gap:14px;width:100%;max-width:400px;margin-top:8px}
  #done .win{border-radius:16px;overflow:hidden;border:2px solid var(--gold-b);box-shadow:0 12px 34px rgba(169,133,69,.25);position:relative}
  #done .win img{width:100%;display:block}
  #done .win .medal{position:absolute;top:10px;right:10px;font-size:26px}
  #done .win .wt{padding:8px;background:#fff;font-family:'Amiri',serif;color:var(--plum)}
  .b-again{margin-top:10px}

  #toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--plum);color:#fff;border-radius:100px;padding:9px 22px;font-size:13px;opacity:0;transition:opacity .3s;z-index:90;pointer-events:none;white-space:nowrap}
  #toast.on{opacity:1}
  .ver{position:fixed;bottom:4px;left:50%;transform:translateX(-50%);font-size:9px;color:#c5bcd1}
</style>
</head>
<body>

<button class="lang-pill" id="langBtn">EN</button>
<header>
  <h1 id="hTitle">يوستينا تختار 🤍</h1>
  <div class="sub" id="hSub">اسحبي يمين لو عجبك · شمال لو مش عاجبك</div>
  <span class="round-pill" id="roundPill"></span>
  <div class="prog"><i id="progFill"></i></div>
</header>

<div id="stage"></div>

<div id="done">
  <h2 id="doneTitle"></h2>
  <div class="sub" id="doneSub"></div>
  <div class="podium" id="podium"></div>
  <button class="b-gold b-again" id="againBtn" style="border:0;border-radius:100px;padding:13px 34px;font-family:'Cairo';font-weight:700;font-size:15px;cursor:pointer"></button>
</div>

<div id="controls">
  <button id="btnUndo" title="undo">↩︎</button>
  <button id="btnNope">✕</button>
  <button id="btnLove">⭐</button>
  <button id="btnLike">♥</button>
  <button id="btnComment">💬</button>
</div>
<p class="hint" id="hint">اضغطي على الصورة لمشاهدة الطقم الكامل والمود بورد</p>

<!-- comment sheet -->
<div class="ov" id="cmtOv" hidden>
  <div class="sheet">
    <h3 id="cmtTitle"></h3>
    <div class="sh-en" id="cmtEn"></div>
    <textarea id="cmtText"></textarea>
    <div class="row">
      <button class="b-ghost" id="cmtCancel"></button>
      <button class="b-gold" id="cmtSave"></button>
    </div>
  </div>
</div>

<!-- suite viewer -->
<div class="ov" id="suiteOv" hidden>
  <div class="sheet">
    <h3 id="suiteTitle"></h3>
    <div class="sh-en" id="suiteEn"></div>
    <div class="suite-grid" id="suiteGrid"></div>
    <div class="row"><button class="b-gold" id="suiteClose"></button></div>
  </div>
</div>

<div id="toast"></div>
<p class="ver">٦ · 6</p>

<script src="manifest.js"></script>
<script>
const SUPA = "https://wydodvbkqhpoyefcwpnf.supabase.co/rest/v1/invite_swipes";
const KEY = "sb_publishable_TSmh8zzk8gvPL5uIrcNbwA_HK45ASUe";
const H = { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json", Prefer: "return=representation" };
const $ = id => document.getElementById(id);
const DECK = (window.DECK || []);
const SUITE_PIECES = [
  ["moodboard","مود بورد","Mood board",1],["invite-church","دعوة الكنيسة فقط","Church-only invite",0],["welcome-sign","لافتة الترحيب","Welcome sign",0],
  ["bride-sign","العروسة جاية","Bride sign",0],["monogram","المونوجرام","Monogram",0],
  ["menu","المنيو","Menu",0],["table-number","رقم الطاولة","Table number",0],
  ["save-the-date","احفظوا التاريخ","Save the date",0],["thank-you","كارت الشكر","Thank you",0],
  ["seating-chart","ترتيب الجلوس","Seating chart",0],
];

const STR = {
  ar: { title:"يوستينا تختار 🤍", sub:"اسحبي يمين لو عجبك · شمال لو مش عاجبك", round:n=>`الجولة ${n}`, left:n=>`فاضل ${n}`,
        peek:"الطقم كامل", cmtTitle:"قوليلنا رأيك ✍️", cmtPh:"إيه اللي عجبك أو مش عاجبك في التصميم ده؟", save:"حفظ", cancel:"إلغاء", close:"إغلاق",
        hint:"اضغطي على «الطقم كامل» لمشاهدة المود بورد وكل القطع", undone:"رجعنا الكارت 🤍", saved:"اتسجل رأيك 🤍", noNet:"النت قطع — هنحاول تاني",
        doneR:n=>`خلصتي الجولة ${n}! 🎉`, doneRSub:n=>`اخترتي ${n} تصميم — يلا جولة كمان نضيّق الاختيار`, again:"جولة كمان ✨",
        champ:"دي اختياراتك النهائية! 🏆", champSub:"هنكمل على الأساس ده — مبروك مقدماً 🤍", restart:"نبدأ من الأول" },
  en: { title:"Youstina Picks 🤍", sub:"Swipe right if you love it · left if you don't", round:n=>`Round ${n}`, left:n=>`${n} left`,
        peek:"Full suite", cmtTitle:"Tell us what you think ✍️", cmtPh:"What do you like or dislike about this design?", save:"Save", cancel:"Cancel", close:"Close",
        hint:"Tap “Full suite” to see the mood board and every piece", undone:"Card returned 🤍", saved:"Saved 🤍", noNet:"Offline — will retry",
        doneR:n=>`Round ${n} complete! 🎉`, doneRSub:n=>`You kept ${n} designs — one more round to narrow it down`, again:"Another round ✨",
        champ:"Your final picks! 🏆", champSub:"We'll build on these — congratulations 🤍", restart:"Start over" },
};
let L = localStorage.getItem("swipeLang") || "ar";
const t = k => STR[L][k];

/* ── state ── */
const SKEY = "youstinaSwipe.v1";
let state = null;
try { state = JSON.parse(localStorage.getItem(SKEY) || "null"); } catch(e) {}
if (!state || !Array.isArray(state.queue)) {
  state = { round: 1, queue: shuffle(DECK.map(d => d.theme)), kept: [], history: [] };
}
state.queue = state.queue.filter(id => DECK.some(d => d.theme === id));
const device = localStorage.getItem("swipeDevice") || (Math.random().toString(36).slice(2, 8));
localStorage.setItem("swipeDevice", device);

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function save(){ localStorage.setItem(SKEY, JSON.stringify(state)); }
function themeOf(id){ return DECK.find(d => d.theme === id); }

/* ── net (queue + retry) ── */
const NQ_KEY = "swipeNetQueue";
let netQ = [];
try { netQ = JSON.parse(localStorage.getItem(NQ_KEY) || "[]"); } catch(e) {}
function flushNet(){
  if (!netQ.length) return;
  const batch = netQ; netQ = []; localStorage.setItem(NQ_KEY, "[]");
  batch.forEach(job => sendSwipe(job, true));
}
async function sendSwipe(row, isRetry){
  try {
    const r = await fetch(SUPA, { method: "POST", headers: H, body: JSON.stringify([row]) });
    if (!r.ok) throw 0;
    const [saved] = await r.json();
    const h = state.history.find(x => x.image_id === row.image_id && x.round === row.round && !x.dbId);
    if (h && saved) { h.dbId = saved.id; save(); }
  } catch(e) {
    netQ.push(row); localStorage.setItem(NQ_KEY, JSON.stringify(netQ));
    if (!isRetry) toast(t("noNet"));
  }
}
setInterval(flushNet, 15000);

/* ── deck rendering ── */
const stage = $("stage");
function renderStack(){
  stage.innerHTML = "";
  const top3 = state.queue.slice(0, 3).reverse();
  top3.forEach((id, i) => {
    const d = themeOf(id); if (!d) return;
    const c = document.createElement("div");
    c.className = "card";
    const depth = top3.length - 1 - i;
    c.style.transform = `translateY(${depth * -9}px) scale(${1 - depth * 0.035})`;
    c.dataset.theme = id;
    c.innerHTML = `
      <img src="img/${id}--invite.jpg" alt="" draggable="false">
      <span class="stamp yes">${L === "ar" ? "عجبني" : "LIKE"}</span>
      <span class="stamp no">${L === "ar" ? "لأ" : "NOPE"}</span>
      <div class="strip">
        <div><div class="t-ar">${d.theme_ar}</div><div class="t-en en">${d.theme_en}</div></div>
        <button class="peek" data-peek="${id}">${t("peek")}</button>
      </div>`;
    stage.appendChild(c);
    if (depth === 0) attachDrag(c);
  });
  const total = DECK.length ? (state.round === 1 ? DECK.length : state.roundSize || state.queue.length + state.kept.length) : 1;
  $("progFill").style.width = Math.min(100, 100 * (1 - state.queue.length / Math.max(1, total))) + "%";
  $("roundPill").textContent = `${t("round")(state.round)} · ${t("left")(state.queue.length)}`;
  if (!state.queue.length) endRound();
}

/* ── drag mechanics ── */
function attachDrag(card){
  let sx = 0, sy = 0, dx = 0, dy = 0, dragging = false;
  const yes = card.querySelector(".stamp.yes"), no = card.querySelector(".stamp.no");
  card.addEventListener("pointerdown", e => {
    if (e.target.closest(".peek")) return;
    dragging = true; sx = e.clientX; sy = e.clientY;
    card.setPointerCapture(e.pointerId);
    card.style.transition = "none"; card.style.cursor = "grabbing";
  });
  card.addEventListener("pointermove", e => {
    if (!dragging) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    card.style.transform = `translate(${dx}px,${dy * 0.4}px) rotate(${dx / 18}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx / 90));
    no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const finish = () => {
    if (!dragging) return; dragging = false;
    card.style.cursor = "grab";
    if (dx > 110) fly(card, 1, "like");
    else if (dx < -110) fly(card, -1, "nope");
    else { card.style.transition = "transform .3s"; card.style.transform = ""; yes.style.opacity = 0; no.style.opacity = 0; }
    dx = 0; dy = 0;
  };
  card.addEventListener("pointerup", finish);
  card.addEventListener("pointercancel", finish);
}
function fly(card, dir, verdict){
  card.style.transition = "transform .45s ease, opacity .45s";
  card.style.transform = `translate(${dir * (window.innerWidth + 200)}px,-40px) rotate(${dir * 24}deg)`;
  card.style.opacity = 0;
  setTimeout(() => decide(verdict), 240);
}

/* ── verdicts ── */
function decide(verdict, comment){
  const id = state.queue[0]; if (!id) return;
  state.queue.shift();
  if (verdict !== "nope") state.kept.push(id);
  const row = { image_id: id, verdict, comment: comment || "", round: state.round, device };
  state.history.push({ ...row, dbId: null });
  save(); sendSwipe(row, false); renderStack();
}
$("btnLike").onclick = () => { const c = stage.querySelector(".card:last-child"); if (c) fly(c, 1, "like"); };
$("btnNope").onclick = () => { const c = stage.querySelector(".card:last-child"); if (c) fly(c, -1, "nope"); };
$("btnLove").onclick = () => { const c = stage.querySelector(".card:last-child"); if (c) { c.querySelector(".stamp.yes").textContent = "⭐"; fly(c, 1, "love"); } };
$("btnUndo").onclick = async () => {
  const last = state.history.pop(); if (!last) return;
  state.queue.unshift(last.image_id);
  state.kept = state.kept.filter(k => k !== last.image_id || last.verdict === "nope");
  if (last.verdict !== "nope") { const i = state.kept.lastIndexOf(last.image_id); if (i >= 0) state.kept.splice(i, 1); }
  save(); renderStack(); toast(t("undone"));
  if (last.dbId) { try { await fetch(`${SUPA}?id=eq.${last.dbId}`, { method: "DELETE", headers: H }); } catch(e) {} }
};

/* ── comment ── */
let pendingComment = false;
$("btnComment").onclick = () => {
  const id = state.queue[0]; if (!id) return;
  const d = themeOf(id);
  $("cmtTitle").textContent = d.theme_ar; $("cmtEn").textContent = d.theme_en;
  $("cmtText").value = ""; $("cmtText").placeholder = t("cmtPh");
  $("cmtOv").hidden = false; setTimeout(() => $("cmtText").focus(), 80);
};
$("cmtCancel").onclick = () => $("cmtOv").hidden = true;
$("cmtSave").onclick = () => {
  const txt = $("cmtText").value.trim();
  $("cmtOv").hidden = true;
  if (!txt) return;
  const id = state.queue[0]; if (!id) return;
  sendSwipe({ image_id: id, verdict: "like", comment: "💬 " + txt, round: state.round, device }, false);
  toast(t("saved"));
};

/* ── suite viewer ── */
stage.addEventListener("click", e => {
  const btn = e.target.closest(".peek"); if (!btn) return;
  const id = btn.dataset.peek; const d = themeOf(id);
  $("suiteTitle").textContent = d.theme_ar; $("suiteEn").textContent = d.theme_en;
  const g = $("suiteGrid"); g.innerHTML = "";
  SUITE_PIECES.forEach(([key, ar, en, wide]) => {
    const f = document.createElement("figure");
    if (wide) f.className = "wide";
    const img = document.createElement("img");
    img.loading = "lazy"; img.src = `img/${id}--${key}.jpg`;
    img.onerror = () => f.remove();
    const cap = document.createElement("figcaption");
    cap.textContent = L === "ar" ? ar : en;
    f.append(img, cap); g.appendChild(f);
  });
  $("suiteOv").hidden = false;
});
$("suiteClose").onclick = () => $("suiteOv").hidden = true;

/* ── rounds ── */
function endRound(){
  const kept = [...new Set(state.kept)];
  $("stage").style.display = "none"; $("controls").style.display = "none"; $("hint").style.display = "none";
  const done = $("done"); done.style.display = "flex";
  if (kept.length <= 3 && state.round > 1 || kept.length <= 1) {
    $("doneTitle").textContent = t("champ"); $("doneSub").textContent = t("champSub");
    const pod = $("podium"); pod.innerHTML = "";
    const medals = ["🥇","🥈","🥉"];
    kept.slice(0, 3).forEach((id, i) => {
      const d = themeOf(id);
      pod.insertAdjacentHTML("beforeend",
        `<div class="win"><span class="medal">${medals[i] || "🏅"}</span><img src="img/${id}--invite.jpg" alt=""><div class="wt">${d.theme_ar} · <span class="en">${d.theme_en}</span></div></div>`);
    });
    $("againBtn").textContent = t("restart");
    $("againBtn").onclick = () => { localStorage.removeItem(SKEY); location.reload(); };
  } else {
    $("doneTitle").textContent = t("doneR")(state.round);
    $("doneSub").textContent = t("doneRSub")(kept.length);
    $("podium").innerHTML = "";
    $("againBtn").textContent = t("again");
    $("againBtn").onclick = () => {
      state.round++; state.roundSize = kept.length;
      state.queue = shuffle(kept); state.kept = [];
      save();
      done.style.display = "none"; $("stage").style.display = ""; $("controls").style.display = "flex"; $("hint").style.display = "";
      renderStack();
    };
  }
}

/* ── misc ── */
let toastTimer;
function toast(msg){ const el = $("toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 2200); }
function applyLang(){
  document.documentElement.lang = L; document.documentElement.dir = L === "ar" ? "rtl" : "ltr";
  $("langBtn").textContent = L === "ar" ? "EN" : "ع";
  $("hTitle").textContent = t("title"); $("hSub").textContent = t("sub"); $("hint").textContent = t("hint");
  $("cmtCancel").textContent = t("cancel"); $("cmtSave").textContent = t("save"); $("suiteClose").textContent = t("close");
  renderStack();
}
$("langBtn").onclick = () => { L = L === "ar" ? "en" : "ar"; localStorage.setItem("swipeLang", L); applyLang(); };
window.addEventListener("online", flushNet);
applyLang(); flushNet();
</script>
